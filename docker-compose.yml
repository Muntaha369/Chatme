version: '3.8'

services:
  # 1. Backend Service
  server:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      # Use the service name "mongo"
      - DB_URI=mongodb://mongo:27017/my_database
    # CRITICAL: This waits for the healthcheck to pass before starting the server
    depends_on:
      mongo:
        condition: service_healthy

  # 2. Frontend Service (Vite)
  client:
    build: ./client
    ports:
      - "5173:5173"
    stdin_open: true
    tty: true
    depends_on:
      - server

  # 3. Database Service
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    # This checks if Mongo is actually accepting connections
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ping: 1})"]
      interval: 10s
      timeout: 5s
      retries: 5

# Persist data even if containers are destroyed
volumes:
  mongo-data: