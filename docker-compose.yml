version: '3.8'

services:
  # 1. Backend Service
  server:
    build: ./server
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - URI=mongodb://mongo:27017/my_database
      - JWT_SECRET_KEY=your_secret_key_here 
    depends_on:
      mongo:
        condition: service_healthy

  # 2. Frontend Service (Vite)
  client:
    build: ./client
    ports:
      - "5173:5173"
    environment:
      # ADDED THIS LINE: Now your React code can access import.meta.env.VITE_SERVER_URL
      - VITE_SERVER_URL=http://localhost:3002
    stdin_open: true
    tty: true
    depends_on:
      - server

  # 3. Database Service
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ping: 1})"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data: